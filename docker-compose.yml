# The dashboard is only reachable over your tailnet. `tailscale serve` (tailscale/serve.json)
# proxies https://school.<your-tailnet>.ts.net to the app over this stack's private Docker
# network. No ports are published on the host.
#
# The app has its own network rather than sharing the tailscale container's: a container
# restart re-creates its network namespace, and an app sharing it would be left offline.
#
# Everything the app keeps is in ./data (database, course library, photos), owned by you: both the app
# and the agent run as PUID:PGID. Create the folders before the first start (see the README), or
# Docker creates the agent's as root and the app can't write to them.
services:
  tailscale:
    image: tailscale/tailscale:latest # pin a version (tailscale/tailscale:v1.x.y) once it works
    hostname: school # becomes https://school.<your-tailnet>.ts.net
    environment:
      # Needed for the first start; the identity is then kept in tailscale-state. An interactive
      # login link doesn't work here: the container gives up on it after about a minute.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true" # use the key only when not already logged in
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true" # serve works without /dev/net/tun or extra capabilities
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOST: 0.0.0.0 # on this stack's network only: nothing is published on the host
      TZ: America/Los_Angeles
      AGENT_URL: http://agent:8790
      SPEECH_URL: http://speech:8000
      HEX_SOCKET: /data/hex/relay.sock # the `hex` service makes it, when it's on
    expose: ["8000"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    restart: unless-stopped

  # The agent: prime-agent with its own persistent home (sessions, memory, Python kernel),
  # separate from any prime-agent setup on the host. It sees a read-only snapshot of the
  # dashboard's database and the course library, and has the Claude API key. No cookies, no
  # .env. Only the app talks to it, over this stack's network.
  agent:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "-m", "app.agent.runner"]
    # Python as PID 1 ignores SIGTERM, so a Docker restart had to kill it, and then didn't start it again
    init: true
    environment:
      TZ: America/Los_Angeles
      HOME: /prime-home
      AGENT_WORKSPACE: /workspace
      PRIME_AGENT_BIN: /opt/prime-agent/bin/prime-agent
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose: ["8790"]
    volumes:
      - ./data/agent-home:/prime-home
      - ./data/agent-workspace:/workspace
      - ./data/snapshot:/workspace/data:ro
      - ./data/library:/workspace/library:ro
      - ./data/uploads:/workspace/uploads:ro # photos attached in tutoring sessions
      - ${PRIME_AGENT_DIR:-./prime-agent}:/opt/prime-agent:ro # prime-agent's install folder (set in .env)
    restart: unless-stopped

  # Voice for tutoring: Speaches, an OpenAI-style speech server, with Whisper (what you say, when Hex isn't writing
  # it down) and Kokoro (reading replies) on the GPU. Only the app talks to it, and it keeps no audio. The models
  # download on the first start (about 2 GB, into the speech-models volume) and stay loaded; together they fit on a
  # 4 GB card. Needs the NVIDIA driver and Container Toolkit on the host (README). Without a GPU, use the
  # 0.9.0-rc.3-cpu image and delete `deploy`; or delete this service, and replies are read in the browser's own voice.
  speech:
    # 0.9 or newer: latest-cuda is still 0.8.3, which ignores PRELOAD_MODELS and the *_MODEL_TTLs below
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    environment:
      # config.yaml's voice.stt_model and voice.tts_model
      PRELOAD_MODELS: '["deepdml/faster-whisper-large-v3-turbo-ct2", "speaches-ai/Kokoro-82M-v1.0-ONNX"]'
      # No float16 anywhere: GTX 16xx cards garble it ("!!!!", or "We'll see you next time." for anything), and
      # plain int8 uses float16 for the layers it doesn't quantize. Newer cards can use int8_float16.
      WHISPER__COMPUTE_TYPE: int8_float32
      STT_MODEL_TTL: -1 # never unload: loading takes seconds, and the first reply would wait for it
      TTS_MODEL_TTL: -1
      ENABLE_UI: "false"
      LOG_LEVEL: info
    expose: ["8000"]
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Dictation through Hex (github.com/anomalyco/hex), if it runs on this server's desktop: it's faster than Whisper,
  # and it uses the model Hex dictates with. COMPOSE_PROFILES=hex in .env turns this on; create data/hex first.
  # Hex listens only on the server's own 127.0.0.1, so this relay runs on the host's network, and the app reaches it
  # through a socket in data/hex. It passes on transcription and nothing else of Hex's (app/hex_relay.py). Hex runs
  # while you're logged in to the desktop; the rest of the time, Whisper writes down what you say.
  hex:
    build: .
    profiles: [hex]
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["python", "-m", "app.hex_relay"]
    init: true
    network_mode: host
    environment:
      HEX_DIR: /hex
      HEX_SOCKET: /run/hex/relay.sock
    # Both folders must exist (run Hex once first), so Docker doesn't make them, as root.
    volumes:
      # Hex's folder: its local-api.json says where Hex listens now
      - {type: bind, source: "${HEX_DIR:-~/.local/share/hex}", target: /hex, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: ./data/hex, target: /run/hex, bind: {create_host_path: false}}
    restart: unless-stopped

volumes:
  tailscale-state:
  speech-models:
